services:
  orangehrm:
    image: orangehrm:5.9
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${OHRM_HOST_PORT}:80'
    volumes:
      - orangehrm_data:/var/www/html
    environment:
      TZ: Asia/Manila
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - orangehrm
    container_name: orangehrm_5.9_app
    command: >
      sh -c '
        tail -n 0 -F /var/www/html/src/log/orangehrm.log &
        exec apache2-foreground
      '

  mariadb:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    restart: unless-stopped
    ports:
      - '127.0.0.1:${OHRM_DB_PORT}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${OHRM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${OHRM_DB_NAME}
      MARIADB_USER: ${OHRM_DB_USER}
      MARIADB_PASSWORD: ${OHRM_DB_PASSWORD}
      TZ: Asia/Manila
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - orangehrm
    container_name: orangehrm_5.9_db

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_WEB_HOST_PORT}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT}:1025'
    volumes:
      - mailpit_data:/data
    environment:
      TZ: Asia/Manila
    networks:
      - orangehrm
    container_name: orangehrm_5.9_mailpit

volumes:
  orangehrm_data:
    name: orangehrm_5.9_data

  mariadb_data:
    name: mariadb_11.4_data

  mailpit_data:
    name: mailpit_1.31.3_data

networks:
  orangehrm:
    driver: bridge
