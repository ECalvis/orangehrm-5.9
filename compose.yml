services:
  orangehrm:
    image: orangehrm:5.9
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${OHRM_HOST_PORT}:80'
    volumes:
      - orangehrm_data:/var/www/html
    environment:
      TZ: Asia/Manila
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - orangehrm
    container_name: orangehrm_5.9_app
    command: >
      sh -c '
        tail -n 0 -F /var/www/html/src/log/orangehrm.log &
        exec apache2-foreground
      '

  mariadb:
    image: mariadb:11.4.13
    restart: unless-stopped
    ports:
      - '127.0.0.1:${OHRM_DB_PORT}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${OHRM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${OHRM_DB_NAME}
      MARIADB_USER: ${OHRM_DB_USER}
      MARIADB_PASSWORD: ${OHRM_DB_PASSWORD}
      TZ: Asia/Manila
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - orangehrm
    container_name: orangehrm_5.9_db

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_WEB_HOST_PORT}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT}:1025'
    volumes:
      - mailpit_data:/data
    environment:
      TZ: Asia/Manila
    networks:
      - orangehrm
    container_name: orangehrm_5.9_mailpit

volumes:
  orangehrm_data:
    name: orangehrm_5.9_data

  mariadb_data:
    name: mariadb_11.4.13_data

  mailpit_data:
    name: mailpit_1.32.0_data

networks:
  orangehrm:
    driver: bridge
